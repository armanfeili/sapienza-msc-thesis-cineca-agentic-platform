[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cineca-agentic-platform"
version = "0.1.0"
description = "Agentic FastAPI service with Memgraph (Cypher via MCP tools), security guardrails, and observability."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["fastapi", "memgraph", "cypher", "agentic", "llm", "mcp", "observability", "security"]
authors = [
  { name = "Arman Feili" }
]
license = { file = "LICENSE" }

# Dependencies are maintained in requirements.txt for this project.
# If you later publish a package, move runtime deps here under `dependencies = []`.

[project.optional-dependencies]
dev = ["ruff>=0.5.0", "black>=24.4.2", "mypy>=1.10.0", "bandit>=1.7.9", "pip-audit>=2.7.3", "psutil>=5.9.0", "pandas>=2.2.0"]
test = ["pytest>=8.2.0", "coverage[toml]>=7.5.0", "psutil>=5.9.0", "pandas>=2.2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = ["tests*", "docs*", "examples*"]

# ---------------- Formatting ----------------
[tool.black]
line-length = 100
target-version = ["py310", "py311"]
include = "\\.pyi?$"
extend-exclude = """
/(
  docs|
  examples|
  ops|
  db/original-dataset|
  db/populated
)/
"""

# ---------------- Ruff (lint + isort) ----------------
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs", "examples", "ops", "db/original-dataset", "db/populated"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "W",   # warnings
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "A",   # flake8-builtins
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "PTH", # flake8-use-pathlib
  "RUF", # ruff-specific
  "PL",  # pylint-like checks
]
ignore = [
  "E501",        # line length (handled by black)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true
force-single-line = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true

# ---------------- Mypy ----------------
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
strict_equality = true
# For third-party stubs that may be missing:
ignore_missing_imports = true
exclude = [
  "^tests/fixtures/.*$",
]

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true
init_typed = true

# ---------------- Pytest ----------------
[tool.pytest.ini_options]
addopts = "-p no:pytest_cov"
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
# Ignore collection warnings for Pydantic models that start with "Test"
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
# Removed timeout for CPU-based LLM models - they need time to process
# timeout = 300
# timeout_method = "thread"
markers = [
  "e2e: end-to-end tests",
  "integration: integration tests",
  "performance: performance tests",
  "security: security-related tests",
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "memgraph_nl: NL→Memgraph Cypher translation and RBAC tests (smoke subset: 10 prompts, ~20 minutes)",
  "memgraph_nl_full: Complete NL→Memgraph catalog (all 47 prompts, ~90 minutes)",
]

# ---------------- Coverage ----------------
[tool.coverage.run]
branch = true
source = ["src"]
omit = [
  "*/tests/*",
  "*/test_*.py",
  "*/__pycache__/*",
  "*/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = true
precision = 2
sort = "Cover"

# Overall threshold: 60%
fail_under = 60

# Granular thresholds per module
[tool.coverage.coverage_conditional]
# Core modules require 80% coverage
core_modules = [
  "src/mcp/core/*",
  "src/mcp/tools/*",
  "src/security/*",
]
core_threshold = 80

# Router modules require 70% coverage  
router_modules = [
  "src/routers/*",
]
router_threshold = 70

# Service modules require 65% coverage
service_modules = [
  "src/services/*",
]
service_threshold = 65

# Exclude from coverage reporting
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if 0:",
  "if False:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
show_contexts = true

[tool.coverage.xml]
output = "coverage.xml"

# ---------------- Bandit (security linter) ----------------
[tool.bandit]
skips = ["B101", "B110", "B601"]   # B101: allow `assert` in tests/utilities, B110: allow try/except/pass for defensive resilience, B601: allow paramiko for ops tools
targets = ["src"]
exclude_dirs = ["/tests", "/examples", "/docs", "/ops"]
# Security issues to check for:
# - SQL injection
# - Shell injection
# - Pickle usage
# - Insecure random
# - Hardcoded passwords
# - Weak crypto
